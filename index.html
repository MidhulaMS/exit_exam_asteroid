<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asteroid Diameter Predictor</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            --accent: #8b5cf6;
            --accent-hover: #a78bfa;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        /* Abstract shapes for background */
        .shape {
            position: absolute;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.6;
        }
        .shape-1 {
            width: 400px; height: 400px;
            background: #8b5cf6;
            top: -100px; left: -100px;
            border-radius: 50%;
            animation: float 10s infinite alternate;
        }
        .shape-2 {
            width: 300px; height: 300px;
            background: #3b82f6;
            bottom: -50px; right: -50px;
            border-radius: 50%;
            animation: float 12s infinite alternate-reverse;
        }

        @keyframes float {
            0% { transform: translateY(0) translateX(0); }
            100% { transform: translateY(50px) translateX(50px); }
        }

        .container {
            width: 100%;
            max-width: 900px;
            padding: 2rem;
            box-sizing: border-box;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 3rem;
            box-shadow: var(--glass-shadow);
            transition: transform 0.3s ease;
        }

        .glass-panel:hover {
            transform: translateY(-5px);
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #e2e8f0, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }

        p.subtitle {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 2.5rem;
            font-size: 1.1rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-secondary);
            transition: color 0.3s;
        }

        input, select {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 0.75rem 1rem;
            color: var(--text-primary);
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.3);
            background: rgba(0, 0, 0, 0.4);
        }

        input:focus + label, select:focus + label {
            color: var(--accent);
        }

        .btn {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 1rem 2rem;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 2rem;
            font-family: 'Outfit', sans-serif;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
        }

        .btn:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.6);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .result-container {
            margin-top: 2rem;
            padding: 1.5rem;
            border-radius: 16px;
            background: rgba(139, 92, 246, 0.1);
            border: 1px solid rgba(139, 92, 246, 0.3);
            text-align: center;
            display: none;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-value {
            font-size: 3rem;
            font-weight: 700;
            color: #fff;
            margin: 0.5rem 0;
            text-shadow: 0 0 20px rgba(139, 92, 246, 0.5);
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 2rem;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>

    <div class="container">
        <div class="glass-panel">
            <h1>DeepAsteroid</h1>
            <p class="subtitle">AI-Powered Asteroid Diameter Prediction</p>

            <form id="predictForm">
                <div class="grid">
                    <div class="input-group">
                        <label>Absolute Magnitude (H)</label>
                        <input type="number" step="0.01" id="val_H" value="16.9" required>
                    </div>
                    <div class="input-group">
                        <label>Semi-major Axis (a)</label>
                        <input type="number" step="0.01" id="val_a" value="2.64" required>
                    </div>
                    <div class="input-group">
                        <label>Eccentricity (e)</label>
                        <input type="number" step="0.001" id="val_e" value="0.15" required>
                    </div>
                    <div class="input-group">
                        <label>Inclination (i)</label>
                        <input type="number" step="0.01" id="val_i" value="5.8" required>
                    </div>
                    <div class="input-group">
                        <label>Perihelion Distance (q)</label>
                        <input type="number" step="0.01" id="val_q" value="2.2" required>
                    </div>
                    <div class="input-group">
                        <label>Mean Motion (n)</label>
                        <input type="number" step="0.001" id="val_n" value="0.22" required>
                    </div>
                    <div class="input-group">
                        <label>Near-Earth Object (NEO)</label>
                        <select id="val_neo">
                            <option value="0">No</option>
                            <option value="1">Yes</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Potentially Hazardous (PHA)</label>
                        <select id="val_pha">
                            <option value="0">No</option>
                            <option value="1">Yes</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn">Predict Diameter</button>
            </form>

            <div class="loading" id="loading">
                <div class="spinner"></div>
            </div>

            <div class="result-container" id="resultContainer">
                <p style="color: var(--text-secondary); margin:0; font-weight:600;">Estimated Diameter</p>
                <div class="result-value"><span id="resultValue">--</span> km</div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('predictForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = e.target.querySelector('button');
            const loading = document.getElementById('loading');
            const resultContainer = document.getElementById('resultContainer');
            
            btn.style.display = 'none';
            resultContainer.style.display = 'none';
            loading.style.display = 'block';

            const payload = {
                H: parseFloat(document.getElementById('val_H').value),
                a: parseFloat(document.getElementById('val_a').value),
                e: parseFloat(document.getElementById('val_e').value),
                i: parseFloat(document.getElementById('val_i').value),
                q: parseFloat(document.getElementById('val_q').value),
                n: parseFloat(document.getElementById('val_n').value),
                neo: parseInt(document.getElementById('val_neo').value),
                pha: parseInt(document.getElementById('val_pha').value)
            };

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const data = await response.json();
                
                if (data.diameter !== undefined) {
                    document.getElementById('resultValue').innerText = data.diameter.toFixed(3);
                    resultContainer.style.display = 'block';
                } else {
                    alert('Error: ' + JSON.stringify(data));
                }
            } catch (err) {
                alert('Prediction failed. Is the server running?');
                console.error(err);
            } finally {
                loading.style.display = 'none';
                btn.style.display = 'block';
            }
        });
    </script>
</body>
</html>
